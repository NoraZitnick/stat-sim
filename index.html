<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Mouse Drug Study — AP Stats Simulation</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Chart.js: popular library for graphs; we use it for histograms -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Maze Mouse Drug Study</h1>
  </header>

  <main class="layout">
    <!-- Sidebar: settings and study design selection -->
    <aside class="sidebar">
      <section class="panel">
        <h2>Settings</h2>

        <label class="field">
          <span>Sample size (number of mice)</span>
          <input type="number" id="sample-size" min="4" max="300" value="20" step="2" />
          <small>Use the Fast forward button below to skip the animation.</small>
        </label>

        <label class="field toggle-field">
          <span>New random maze each run</span>
          <input type="checkbox" id="random-maze" checked />
        </label>

        <fieldset class="field">
          <legend>Assignment method</legend>

          <label class="radio">
            <input type="radio" name="assignment" value="random" checked />
            <span>
              <strong>Random assignment</strong>
            </span>
          </label>

          <label class="radio">
            <input type="radio" name="assignment" value="block" />
            <span>
              <strong>Block assignment (by litter)</strong>
            </span>
          </label>

          <label class="radio">
            <input type="radio" name="assignment" value="matched" />
            <span>
              <strong>Matched pairs (each mouse runs twice)</strong>
            </span>
          </label>
        </fieldset>

        <div class="button-row">
          <button id="run-btn" class="btn primary">Run simulation</button>
          <button id="reset-btn" class="btn secondary">Reset</button>
        </div>

        <button id="fast-forward-btn" class="btn fast-forward" disabled>
          Fast forward (skip animation)
        </button>

        <p id="status" class="status">Ready. Choose settings and click Run simulation.</p>
      </section>
    </aside>

    <!-- Center: maze visualization -->
    <section class="maze-section">
      <div class="maze-header">
        <h2 id="maze-title">Maze run</h2>
      </div>
      <canvas id="maze-canvas" width="520" height="520"></canvas>

      <section class="panel legend-panel">
        <h2>Legend</h2>
        <div class="legend-grid">
          <ul class="legend-list legend-col" id="legend-list">
            <li><span class="swatch collar-control"></span> Gray collar = control</li>
            <li><span class="swatch collar-drug"></span> Green collar = drug</li>
          </ul>
          <ul class="legend-list legend-col" id="litter-legend"></ul>
        </div>
      </section>
    </section>

    <!-- Right: histograms -->
    <section class="charts-section">
      <h2>Completion times (seconds)</h2>
      <p id="chart-caption" class="chart-caption">
        Histograms update as each mouse finishes.
      </p>
      <div class="charts-grid" id="charts-grid"></div>
      <p id="summary" class="summary"></p>
      <p id="pvalue" class="pvalue"></p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
